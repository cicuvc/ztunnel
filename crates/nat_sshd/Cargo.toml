[package]
name = "nat-sshd"
version = "0.1.0"
edition = "2021"

[dependencies]
zt-common = { path = "../zt-common" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
anyhow = "1"
