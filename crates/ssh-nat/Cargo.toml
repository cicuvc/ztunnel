[package]
name = "ssh-nat"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ssh-nat"
path = "src/main.rs"

[dependencies]
zt-common = { path = "../zt-common" }
clap = { version = "4", features = ["derive"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
