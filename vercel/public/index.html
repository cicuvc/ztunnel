<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ztunnel</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 20px; background: #111; color: #eee; }
  h1 { color: #0f0; }
  pre { background: #222; padding: 15px; border-radius: 8px; white-space: pre-wrap; }
  a { color: #6cf; }
</style>
</head>
<body>
<h1>ztunnel</h1>
<pre id="s">Initializing...</pre>
<p><small><a href="/?bootstrap=1" id="bypass">直接访问</a></small></p>
<script>
document.getElementById('s').textContent = '';

if (location.search.includes('bootstrap')) {
  document.getElementById('s').textContent = 'Bootstrap mode — SW bypassed.';
} else if (!('serviceWorker' in navigator)) {
  document.getElementById('s').textContent = 'Service Worker not supported.';
} else {
  // Fetch config first so the SW has it immediately on activation.
  fetch('/api?cmd=web-config', { cache: 'no-store' })
    .catch(() => null)
    .then(() => navigator.serviceWorker.register('/sw.js', { scope: '/' }))
    .then(() => navigator.serviceWorker.ready)
    .then(reg => {
      reg.active.postMessage({ type: 'refresh-config' });
      // Reload — the SW intercepts and returns the backend content.
      location.reload();
    })
    .catch(e => {
      document.getElementById('s').textContent = 'SW init failed: ' + e.message;
    });
}
</script>
</body>
</html>
