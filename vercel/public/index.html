<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<style>
  html, body { background: #fff; margin: 0; padding: 0; }
</style>
<script>
// Minimal landing page: register the proxy SW, then return to the
// originally-requested path.  Vercel rewrites unknown paths to "/", but
// the browser URL keeps the deep link (e.g. /vp_main/posts/...), so
// location.pathname preserves it across an SW (re)registration.
(function () {
  var orig = location.pathname + location.search;
  var isRoot = orig === '/' || orig === '/index.html' || orig === '';
  // Default landing target; deep links stay where they were.
  var target = isRoot ? '/vp_main' : orig;

  if (location.search.indexOf('bootstrap') !== -1) {
    location.replace(target);
    return;
  }
  if (!('serviceWorker' in navigator)) {
    location.href = 'https://tapi.cicuvc.top/?bootstrap=1';
    return;
  }
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(function () { return navigator.serviceWorker.ready; })
    .then(function (reg) {
      if (reg.active) reg.active.postMessage({ type: 'refresh-config' });
      if (navigator.serviceWorker.controller) {
        location.replace(target);
      } else {
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          location.replace(target);
        }, { once: true });
      }
    })
    .catch(function () {
      location.replace('https://tapi.cicuvc.top/?bootstrap=1');
    });
})();
</script>
</head>
<body>
</body>
</html>
