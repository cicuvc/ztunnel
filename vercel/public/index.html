<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<style>
  html, body { background: #fff; margin: 0; padding: 0; }
</style>
<script>
// Minimal landing page: register the proxy SW, then go straight to /vp_main.
// The SW's clients.claim() makes it control this page, so the redirect
// request is intercepted and proxied to the NAT backend.
(function () {
  if (location.search.includes('bootstrap')) {
    location.replace('/vp_main?bootstrap=1');
    return;
  }
  if (!('serviceWorker' in navigator)) {
    location.href = 'https://tapi.cicuvc.top/?bootstrap=1';
    return;
  }
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(() => navigator.serviceWorker.ready)
    .then(reg => {
      if (reg.active) reg.active.postMessage({ type: 'refresh-config' });
      if (navigator.serviceWorker.controller) {
        location.replace('/vp_main');
      } else {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          location.replace('/vp_main');
        }, { once: true });
      }
    })
    .catch(() => {
      // SW failed; fall back to the registry host so users can still reach it.
      location.replace('https://tapi.cicuvc.top/?bootstrap=1');
    });
})();
</script>
</head>
<body>
</body>
</html>
